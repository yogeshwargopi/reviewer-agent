services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: reviewer
      POSTGRES_PASSWORD: reviewer
      POSTGRES_DB: reviewer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewer -d reviewer"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: npm run start
    env_file: .env
    environment:
      DATABASE_URL: postgres://reviewer:reviewer@postgres:5432/reviewer
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: npm run worker
    env_file: .env
    environment:
      DATABASE_URL: postgres://reviewer:reviewer@postgres:5432/reviewer
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
